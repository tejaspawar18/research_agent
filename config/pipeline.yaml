# Pipeline Configuration

# Schedule (cron: minute hour day month day_of_week)
schedule: "*/30 3-13 * * *"  # Every 30 minutes, 9 AM - 7 PM IST (UTC+5:30)

# Processing limits
max_articles_per_run: 500
max_articles_per_source: 50
relevance_threshold: 60.0

# Parallelization
parallel_crawlers: 5

# Quality thresholds
dedup_similarity_threshold: 0.80
min_sample_size_observational: 150
min_sample_size_rct: 50

# Weekly feedback PDF report
weekly_report_lookback_days: 7
weekly_report_top_articles_per_channel: 5
weekly_report_output_dir: "data/weekly_reports"
weekly_report_hour: 4        # Monday 10:00 AM IST
weekly_report_minute: 30
weekly_report_day_of_week: "mon"
