  - name: bmj
    type: journal
    fetch_method: rss
    rss: "https://www.bmj.com/rss.xml"
    pdf_strategy: playwright
    selectors: {}
    
  # NOTE: JAHA - using RSS for quality article extraction  
  - name: jaha
