  # NOTE: Cell also uses Cloudflare, using RSS feed
  - name: cell_neuron
    type: journal
    fetch_method: rss
    rss: "https://www.cell.com/neuron/inpress.rss"
    pdf_strategy: playwright
    selectors:
      pdf_button: "a:has-text('PDF')"

  # NOTE: BMJ - removed bad selector to use URL pattern filtering
  - name: bmj_clinical_review
    type: journal
    fetch_method: list_page
    url: "https://www.bmj.com/education/clinical-review"
    pdf_strategy: playwright
    selectors: {}

  - name: bmj_research
