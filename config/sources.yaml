# Research Agent - Medical Sources Configuration
# ================================================
# Fetch Methods:
#   - rss: Parse RSS/Atom feeds
#   - list_page: Extract article links from HTML page
#   - sitemap: Parse XML sitemap
# PDF Strategy:
#   - playwright: Use Playwright to click PDF buttons
#   - direct: Direct PDF links available
#   - none: No PDF expected (news/blog content)

sources:
  # ============================================
  # JOURNALS - RSS FEEDS
  # ============================================
  
  - name: nature
    type: journal
    fetch_method: rss
    rss: "https://www.nature.com/nature.rss"
    pdf_strategy: playwright
    selectors:
      pdf_button: "a[data-track-action='download pdf']"
      article_link: ".c-card__link"

  - name: nature_communications
    type: journal
    fetch_method: rss
    rss: "https://www.nature.com/ncomms.rss"
    pdf_strategy: playwright
    selectors:
      pdf_button: "a[data-track-action='download pdf']"

  - name: nature_food
    type: journal
    fetch_method: rss
    rss: "https://www.nature.com/natfood.rss"
    pdf_strategy: playwright
    selectors:
      pdf_button: "a[data-track-action='download pdf']"

  - name: eurjmedres
    type: journal
    fetch_method: rss
    rss: "https://eurjmedres.biomedcentral.com/articles/most-recent/rss.xml"
    pdf_strategy: playwright
    selectors:
      pdf_button: "a:has-text('PDF')"

  # ============================================
  # JOURNALS - LIST PAGES
  # ============================================

  # NOTE: Lancet blocks scraping with Cloudflare, using RSS feeds instead
