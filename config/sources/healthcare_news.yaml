# Healthcare News, Journals & Government Sources
sources:
  # Cochrane Library - Systematic Reviews
  # Note: cochranelibrary.com is behind Cloudflare bot protection; RSS may need browser-like access
  - source_id: cochrane_reviews
    name: "Cochrane Library - Systematic Reviews"
    url: "https://www.cochranelibrary.com/cdsr/reviews"
    source_type: journal
    quality_tier: high
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://www.cochranelibrary.com/cdsr/table-of-contents/rss.xml"

  # Health Policy Watch - NCD Coverage (WordPress - verified working RSS)
  - source_id: health_policy_watch
    name: "Health Policy Watch - NCDs"
    url: "https://healthpolicy-watch.news/category/noncommunicable-diseases/"
    source_type: news
    quality_tier: medium
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://healthpolicy-watch.news/category/noncommunicable-diseases/feed/"

  # Reuters Healthcare - No RSS (discontinued in 2020)
  - source_id: reuters_healthcare
    name: "Reuters Healthcare & Pharmaceuticals"
    url: "https://www.reuters.com/business/healthcare-pharmaceuticals/"
