# High-quality peer-reviewed journals
sources:
  # Nature Publishing Group
  - source_id: nature_research
    name: "Nature Research Articles"
    url: "https://www.nature.com/nature/research-articles.rss"
    source_type: journal
    quality_tier: high
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://www.nature.com/nature.rss"

  - source_id: nature_communications
    name: "Nature Communications"
    url: "https://www.nature.com/ncomms.rss"
    source_type: journal
