    enabled: true
    rss_url: "https://www.ahajournals.org/action/showFeed?type=etoc&feed=rss&jc=jaha"

  # IHME - Using newsroom page (research library returns 403)
  - source_id: ihme
    name: "Institute for Health Metrics and Evaluation"
    url: "https://www.healthdata.org/news-events/newsroom"
    source_type: journal
    quality_tier: high
    crawl_method: html_scrape
    rate_limit: 5
    enabled: true
    css_selectors:
      article_list: ".c-card"
      title: ".c-card__title"
      link: "a"
      date: ".c-card__eyebrow"

  # Obesity & Energetics
  - source_id: obesity_energetics
    name: "Obesity and Energy Offerings"
    url: "https://www.obesityandenergetics.org/"
    source_type: journal
    quality_tier: medium
    crawl_method: html_scrape
    rate_limit: 5
    enabled: true
    css_selectors:
      article_list: ".node"
      title: "h2 a, h3 a"
      link: "h2 a, h3 a"
      date: "h2 a, h3 a"

