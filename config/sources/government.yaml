# Government & Institutional Sources
sources:
  # NIH
  - source_id: nih_news
    name: "National Institutes of Health"
    url: "https://www.nih.gov/news-events/news-releases"
    source_type: government
    quality_tier: high
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://www.nih.gov/news-releases/feed.xml"

  # CDC
  - source_id: cdc_media
    name: "Centers for Disease Control and Prevention"
    url: "https://www.cdc.gov/media/"
    source_type: government
    quality_tier: high
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://tools.cdc.gov/api/v2/resources/media/132608.rss"

  # ECDC - Topic-wise feeds (old monolithic rss.xml no longer exists)
  - source_id: ecdc_publications
    name: "ECDC - Publications"
    url: "https://www.ecdc.europa.eu/en/publications-data"
    source_type: government
    quality_tier: high
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://www.ecdc.europa.eu/en/taxonomy/term/1244/feed"

  - source_id: ecdc_epidemiological_updates
    name: "ECDC - Epidemiological Updates"
    url: "https://www.ecdc.europa.eu/en/epidemiological-updates"
    source_type: government
    quality_tier: high
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://www.ecdc.europa.eu/en/taxonomy/term/1310/feed"

  - source_id: ecdc_risk_assessments
    name: "ECDC - Risk Assessments"
    url: "https://www.ecdc.europa.eu/en/threats-and-outbreaks"
    source_type: government
    quality_tier: high
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://www.ecdc.europa.eu/en/taxonomy/term/1295/feed"

  - source_id: ecdc_surveillance
    name: "ECDC - Surveillance Reports"
    url: "https://www.ecdc.europa.eu/en/surveillance-reports"
    source_type: government
    quality_tier: high
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://www.ecdc.europa.eu/en/taxonomy/term/1253/feed"

  - source_id: ecdc_guidance
    name: "ECDC - Guidance"
    url: "https://www.ecdc.europa.eu/en/guidance"
    source_type: government
    quality_tier: high
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://www.ecdc.europa.eu/en/taxonomy/term/1301/feed"

  # PIB India - Disabled: posts images of official notices, not extractable text
  - source_id: pib_india
    name: "Press Information Bureau - India"
    url: "https://www.pib.gov.in/indexd.aspx"
    source_type: government
    quality_tier: high
    crawl_method: rss
    rate_limit: 5
    enabled: false
    rss_url: "https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3"

  # American Heart Association - Research (heart.org returns 403, using AHA Journals RSS)
  - source_id: aha_circulation
    name: "AHA - Circulation Research"
    url: "https://www.ahajournals.org/journal/circ"
    source_type: organization
    quality_tier: high
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://www.ahajournals.org/action/showFeed?type=etoc&feed=rss&jc=circ"
