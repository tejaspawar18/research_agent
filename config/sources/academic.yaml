# Academic Institutions & Expert Sources
# Note: crawl_method: adaptive will try RSS, HTML, and auto-detection in sequence
sources:
  # Harvard
  - source_id: harvard_medicine
    name: "Harvard Medicine Magazine"
    url: "https://magazine.hms.harvard.edu/articles"
    source_type: academic
    quality_tier: medium
    crawl_method: adaptive
    rate_limit: 5
    enabled: true
    css_selectors:
      article_list: ".views-row"
      title: "h2 a, h3 a"
      link: "h2 a, h3 a"
      date: ".date"

  - source_id: yale_medicine
    name: "Yale Medicine - Research"
    url: "https://www.yalemedicine.org/search/news?tagId=1"
    source_type: academic
    quality_tier: medium
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://www.yalemedicine.org/rss/news.xml"

