# Academic Institutions & Expert Sources
# Note: crawl_method: adaptive will try RSS, HTML, and auto-detection in sequence
sources:
  # Harvard - Gazette RSS (hms.harvard.edu blocked by Incapsula WAF)
  - source_id: harvard_medicine
    name: "Harvard Gazette - Health & Medicine"
    url: "https://news.harvard.edu/gazette/topic/health-medicine/"
    source_type: academic
    quality_tier: medium
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://news.harvard.edu/gazette/feed/"

  - source_id: yale_medicine
    name: "Yale Medicine - Research"
    url: "https://www.yalemedicine.org/search/news?tagId=1"
    source_type: academic
    quality_tier: medium
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://www.yalemedicine.org/rss/news.xml"

  # Yale Medicine - Disabled: yalemedicine.org uses JS-rendered pages, no per-category
  # RSS feeds available. The yale_medicine source above covers all news via RSS.
  - source_id: yale_medicine_research
    name: "Yale Medicine - Research"
    url: "https://www.yalemedicine.org/search/news?tagId=1"
    source_type: academic
    quality_tier: medium
    crawl_method: adaptive
    rate_limit: 5
    enabled: false

  - source_id: yale_medicine_clinical
    name: "Yale Medicine - Clinical"
    url: "https://www.yalemedicine.org/search/news?tagId=2"
    source_type: academic
    quality_tier: medium
    crawl_method: adaptive
    rate_limit: 5
    enabled: false

  - source_id: yale_medicine_cancer
    name: "Yale Medicine - Cancer Answers"
    url: "https://www.yalemedicine.org/news/category/cancer-answers"
    source_type: academic
    quality_tier: medium
    crawl_method: adaptive
    rate_limit: 5
    enabled: false

  - source_id: yale_medicine_conditions
    name: "Yale Medicine - Conditions"
    url: "https://www.yalemedicine.org/search/news?tagId=4"
    source_type: academic
    quality_tier: medium
    crawl_method: adaptive
    rate_limit: 5
    enabled: false

  # MIT
  - source_id: mit_science
    name: "MIT News - School of Science"
    url: "https://news.mit.edu/school/science"
    source_type: academic
    quality_tier: medium
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://news.mit.edu/rss/research"

  # Stanford
  - source_id: stanford_medicine
    name: "Stanford Medicine News"
    url: "https://med.stanford.edu/news.html"
    source_type: academic
    quality_tier: medium
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://med.stanford.edu/news.xml"

  # Peter Attia - Expert Blog
  - source_id: peter_attia
    name: "Peter Attia MD - Newsletter"
    url: "https://peterattiamd.com/category/weekly-newsletter/"
    source_type: expert_blog
    quality_tier: medium
    crawl_method: rss
    rate_limit: 5
    enabled: true
    rss_url: "https://peterattiamd.com/feed/"