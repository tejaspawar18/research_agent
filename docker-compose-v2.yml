version: '3.8'

services:
  # ===================
  # PHASE 1: DISCOVERY
  # ===================
  
  crawler:
    build:
      context: .
      dockerfile: services/crawler/Dockerfile
    container_name: health-crawler
    environment:
      - ENVIRONMENT=${ENVIRONMENT:- production}
      - SCYLLA_KEYSPACE=ai_events
      # ScyllaDB - Production
      - SCYLLA_HOST_PROD_LST=${SCYLLA_HOST_PROD_LST}
      - SCYLLA_USERNAME_PROD=${SCYLLA_USERNAME_PROD}
      - SCYLLA_PASSWORD_PROD=${SCYLLA_PASSWORD_PROD}
      # ScyllaDB - Beta
      - SCYLLA_HOST_BETA=${SCYLLA_HOST_BETA}
      - SCYLLA_USERNAME_BETA=${SCYLLA_USERNAME_BETA}
      - SCYLLA_PASSWORD_BETA=${SCYLLA_PASSWORD_BETA}
      - REDIS_URL=redis://redis:6379
      - PUBMED_API_KEY=${PUBMED_API_KEY}
      # Independent cron
      - CRON_SCHEDULE=0 */2 * * *  # Every 2 hours
      - RUN_MODE=cron
      - MAX_ARTICLES_PER_SOURCE=50
    depends_on:
      scylladb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    volumes:
      - ./config:/app/config:ro
    networks:
      - health-network
    restart: unless-stopped

  # ===================
  # PHASE 1.5: DEDUPLICATION
  # ===================

  dedup:
    build:
      context: .
      dockerfile: services/dedup/Dockerfile
    container_name: health-dedup
    environment:
      - ENVIRONMENT=${ENVIRONMENT:- production}
      - SCYLLA_KEYSPACE=ai_events
      # ScyllaDB - Production
      - SCYLLA_HOST_PROD_LST=${SCYLLA_HOST_PROD_LST}
      - SCYLLA_USERNAME_PROD=${SCYLLA_USERNAME_PROD}
      - SCYLLA_PASSWORD_PROD=${SCYLLA_PASSWORD_PROD}
      # ScyllaDB - Beta
      - SCYLLA_HOST_BETA=${SCYLLA_HOST_BETA}
      - SCYLLA_USERNAME_BETA=${SCYLLA_USERNAME_BETA}
      - SCYLLA_PASSWORD_BETA=${SCYLLA_PASSWORD_BETA}
      - REDIS_URL=redis://redis:6379
    depends_on:
      scylladb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8002"
    volumes:
      - ./config:/app/config:ro
    networks:
      - health-network
    restart: unless-stopped

  # ===================
  # PHASE 2: EXTRACTION (Workers)
  # ===================

  extraction-worker-1:
    build:
      context: .
      dockerfile: services/extraction/Dockerfile
    container_name: health-extraction-1
    environment:
      - ENVIRONMENT=${ENVIRONMENT:- production}
      - SCYLLA_KEYSPACE=ai_events
      # ScyllaDB - Production
      - SCYLLA_HOST_PROD_LST=${SCYLLA_HOST_PROD_LST}
      - SCYLLA_USERNAME_PROD=${SCYLLA_USERNAME_PROD}
      - SCYLLA_PASSWORD_PROD=${SCYLLA_PASSWORD_PROD}
      # ScyllaDB - Beta
      - SCYLLA_HOST_BETA=${SCYLLA_HOST_BETA}
      - SCYLLA_USERNAME_BETA=${SCYLLA_USERNAME_BETA}
      - SCYLLA_PASSWORD_BETA=${SCYLLA_PASSWORD_BETA}
      - REDIS_URL=redis://redis:6379
      - PUBMED_API_KEY=${PUBMED_API_KEY}
      # AWS S3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - S3_BUCKET=${S3_BUCKET:-pulse-narrative}
      # Worker config
      - WORKER_ID=1
      - CRON_SCHEDULE=*/30 * * * *  # Every 30 minutes
      - RUN_MODE=cron
      - BATCH_SIZE=50
      - PARALLEL_WORKERS=5
    depends_on:
      scylladb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8003:8003"
    volumes:
      - ./config:/app/config:ro
    networks:
      - health-network
    restart: unless-stopped

  # Optional: Additional extraction workers for scaling
  extraction-worker-2:
    build:
      context: .
      dockerfile: services/extraction/Dockerfile
    container_name: health-extraction-2
    environment:
      - ENVIRONMENT=${ENVIRONMENT:- production}
      - SCYLLA_KEYSPACE=ai_events
      # ScyllaDB - Production
      - SCYLLA_HOST_PROD_LST=${SCYLLA_HOST_PROD_LST}
      - SCYLLA_USERNAME_PROD=${SCYLLA_USERNAME_PROD}
      - SCYLLA_PASSWORD_PROD=${SCYLLA_PASSWORD_PROD}
      # ScyllaDB - Beta
      - SCYLLA_HOST_BETA=${SCYLLA_HOST_BETA}
      - SCYLLA_USERNAME_BETA=${SCYLLA_USERNAME_BETA}
      - SCYLLA_PASSWORD_BETA=${SCYLLA_PASSWORD_BETA}
      - REDIS_URL=redis://redis:6379
      - PUBMED_API_KEY=${PUBMED_API_KEY}
      # AWS S3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - S3_BUCKET=${S3_BUCKET:-pulse-narrative}
      - WORKER_ID=2
      - CRON_SCHEDULE=15,45 * * * *  # Offset from worker 1
      - RUN_MODE=cron
      - BATCH_SIZE=50
      - PARALLEL_WORKERS=5
    depends_on:
      scylladb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - health-network
    restart: unless-stopped
    profiles:
      - scaled  # Only starts with: docker-compose --profile scaled up

  # ===================
  # PHASE 3: LLM PROCESSING
  # ===================
  
  llm:
    build:
      context: .
      dockerfile: services/llm/Dockerfile
    container_name: health-llm
    environment:
      - ENVIRONMENT=${ENVIRONMENT:- production}
      - SCYLLA_KEYSPACE=ai_events
      # ScyllaDB - Production
      - SCYLLA_HOST_PROD_LST=${SCYLLA_HOST_PROD_LST}
      - SCYLLA_USERNAME_PROD=${SCYLLA_USERNAME_PROD}
      - SCYLLA_PASSWORD_PROD=${SCYLLA_PASSWORD_PROD}
      # ScyllaDB - Beta
      - SCYLLA_HOST_BETA=${SCYLLA_HOST_BETA}
      - SCYLLA_USERNAME_BETA=${SCYLLA_USERNAME_BETA}
      - SCYLLA_PASSWORD_BETA=${SCYLLA_PASSWORD_BETA}
      - REDIS_URL=redis://redis:6379
      # LLM Provider: openai, anthropic, or gemini
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_API_KEY=${GEMINI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.0-flash}
      # Independent cron
      - CRON_SCHEDULE=0 * * * *  # Every hour
      - RUN_MODE=cron
      - BATCH_SIZE=20
    depends_on:
      scylladb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8004:8004"
    volumes:
      - ./config:/app/config:ro
    networks:
      - health-network
    restart: unless-stopped

  # ===================
  # PHASE 4: NOTIFICATION
  # ===================
  
  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: health-notification
    environment:
      - ENVIRONMENT=${ENVIRONMENT:- production}
      - SCYLLA_KEYSPACE=ai_events
      # ScyllaDB - Production
      - SCYLLA_HOST_PROD_LST=${SCYLLA_HOST_PROD_LST}
      - SCYLLA_USERNAME_PROD=${SCYLLA_USERNAME_PROD}
      - SCYLLA_PASSWORD_PROD=${SCYLLA_PASSWORD_PROD}
      # ScyllaDB - Beta
      - SCYLLA_HOST_BETA=${SCYLLA_HOST_BETA}
      - SCYLLA_USERNAME_BETA=${SCYLLA_USERNAME_BETA}
      - SCYLLA_PASSWORD_BETA=${SCYLLA_PASSWORD_BETA}
      - REDIS_URL=redis://redis:6379
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      # Independent cron
      - CRON_SCHEDULE=0 7 * * *  # Daily at 7 AM
      - RUN_MODE=cron
    depends_on:
      scylladb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8005:8005"
    volumes:
      - ./config:/app/config:ro
    networks:
      - health-network
    restart: unless-stopped

  # ===================
  # OPTIONAL: ORCHESTRATOR
  # For manual full-pipeline runs
  # ===================
  
  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: health-orchestrator
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      # Environment
      - ENVIRONMENT=${ENVIRONMENT:- production}
      - SCYLLA_KEYSPACE=ai_events
      # ScyllaDB - Production
      - SCYLLA_HOST_PROD_LST=${SCYLLA_HOST_PROD_LST}
      - SCYLLA_USERNAME_PROD=${SCYLLA_USERNAME_PROD}
      - SCYLLA_PASSWORD_PROD=${SCYLLA_PASSWORD_PROD}
      # ScyllaDB - Beta
      - SCYLLA_HOST_BETA=${SCYLLA_HOST_BETA}
      - SCYLLA_USERNAME_BETA=${SCYLLA_USERNAME_BETA}
      - SCYLLA_PASSWORD_BETA=${SCYLLA_PASSWORD_BETA}
      # Redis
      - REDIS_URL=redis://redis:6379
      # Kafka
      - KAFKA_BROKER_PROD=${KAFKA_BROKER_PROD}
      - KAFKA_BROKER_BETA=${KAFKA_BROKER_BETA}
      - KAFKA_TOPIC_ARTICLES=${KAFKA_TOPIC_ARTICLES:-preventive-health-articles}
      - KAFKA_TOPIC_EVENTS=${KAFKA_TOPIC_EVENTS:-preventive-health-events}
      - PRODUCER_CLIENT_ID=${PRODUCER_CLIENT_ID:-preventive-health-pipeline-producer}
      # AWS S3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - S3_BUCKET=${S3_BUCKET:-pulse-narrative}
      # Service URLs (using container names for Docker network)
      - CRAWLER_URL=http://health-crawler:8001
      - DEDUP_URL=http://health-dedup:8002
      - EXTRACTION_URL=http://health-extraction-1:8003
      - LLM_URL=http://health-llm:8004
      - NOTIFICATION_URL=http://health-notification:8005
      # Slack (for weekly digest)
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      # Disable scheduled runs (use independent crons instead)
      - ENABLE_SCHEDULER=false
    depends_on:
      - crawler
      - dedup
      - extraction-worker-1
      - llm
      - notification
    ports:
      - "8006:8006"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    networks:
      - health-network
    restart: unless-stopped

  # ===================
  # API GATEWAY
  # ===================
  
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: health-api-gateway
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8006
      - CRAWLER_URL=http://crawler:8001
      - EXTRACTION_URL=http://extraction-worker-1:8003
      - LLM_URL=http://llm:8004
      - NOTIFICATION_URL=http://notification:8005
    depends_on:
      - orchestrator
    ports:
      - "8000:8000"
    networks:
      - health-network
    restart: unless-stopped

  # ===================
  # INFRASTRUCTURE
  # ===================
  
  scylladb:
    image: scylladb/scylla:5.4
    container_name: health-scylladb
    command: --smp 2 --memory 1G --overprovisioned 1 --api-address 0.0.0.0
    volumes:
      - scylla-data:/var/lib/scylla
    ports:
      - "9042:9042"
      - "9180:9180"
    networks:
      - health-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: health-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - health-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================
  # MONITORING (Optional)
  # ===================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: health-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - health-network
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: health-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - health-network
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  health-network:
    driver: bridge

volumes:
  scylla-data:
  redis-data:
  prometheus-data:
  grafana-data:
